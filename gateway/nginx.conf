server {
  listen ${PORT};
  server_name _;
  modsecurity on;
  set $test_client_ip_enabled ${ALLOW_TEST_CLIENT_IP};
  set $security_client_ip $remote_addr;
  if ($test_client_ip_enabled = 1) {
    set $security_client_ip $http_x_demo_client_ip;
  }
  client_max_body_size 1m;
  proxy_connect_timeout 3s;
  proxy_read_timeout 15s;
  location = /health { return 200 "healthy\n"; add_header Content-Type text/plain; }
  location = /_security_check {
    internal;
    proxy_pass ${SECURITY_API_URL}/api/v1/gateway/check?site_id=demo;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Site-Key ${SITE_KEY};
    proxy_set_header X-Real-IP $security_client_ip;
    proxy_set_header X-Original-URI $request_uri;
  }
  location / {
    auth_request /_security_check;
    auth_request_set $gateway_security_status $upstream_http_x_security_status;
    error_page 401 403 500 = @gateway_denied;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass ${BACKEND};
  }
  location @gateway_denied {
    if ($gateway_security_status = 429) { return 429; }
    return 403;
  }
}
